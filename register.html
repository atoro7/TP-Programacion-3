<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArroyoRent - Paso 1: Datos Personales</title>
    <link rel="stylesheet" href="./variables.css">
    <link rel="stylesheet" href="./styles2.css">
</head>
<body>

    <header style="justify-content: center;">
        <div class="logo">
            <img src="img/logo.png" alt="ArroyoRent Alquiler de Vehículos">
        </div>
    </header>

    <main class="reserva-main">
        <div class="wrapper">
            
            <div class="step-indicator">
                <span class="active-step">Paso 1: Personal</span> → <span class="pending-step">Paso 2: Alquiler</span>
            </div>

            <div class="form-card-static">
                <div class="title">Datos Personales</div>
                <p class="step-desc">Identificación del conductor para la reserva</p>
                
                <div class="flip-card__form">
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido *</label>
                        <input class="flip-card__input" type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input class="flip-card__input" type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Número de Teléfono *</label>
                        <input class="flip-card__input" type="tel" id="telefono" name="telefono" placeholder="Ej: 3364123456" required>
                    </div>

                    <div class="form-group">
                        <label for="documento">DNI / Pasaporte *</label>
                        <input class="flip-card__input" type="text" id="documento" name="documento" placeholder="Ej: 42345678" required>
                    </div>
                </div>
                
                <a href="./reserva.html" class="next-step-btn-link">Siguiente Paso →</a>
            </div>

        </div>
    </main>

    <footer>
        <div class="footer-container" style="justify-content: center; text-align: center;">
            <div>
                <h3>ArroyoRent</h3>
                <p>Tu libertad de moverte en San Nicolás y la región.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 ArroyoRent. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
