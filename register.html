<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArroyoRent - Paso 1: Datos Personales</title>
    <link rel="stylesheet" href="./variables.css">
    <link rel="stylesheet" href="./styles2.css">
</head>
<body>

    <header style="justify-content: center;">
    <div class="logo">
        <a href="./index.html">
            <img src="img/logo.png" alt="ArroyoRent Alquiler de Vehículos" style="cursor: pointer;">
        </a>
    </div>
    </header>

    <main class="reserva-main">
    <div class="wrapper">
        
        <div class="step-indicator">
            <span class="active-step">Paso 1: Personal</span> → <span class="pending-step">Paso 2: Alquiler</span>
        </div>

        <form action="./reserva.html" method="GET" class="form-card-static">
            <div class="title">Datos Personales</div>
            <p class="step-desc">Identificación del conductor para la reserva</p>
            
            <div class="flip-card__form">
                <div class="form-group">
                    <label for="nombre">Nombre y Apellido *</label>
                    <div class="input-wrapper-cyber">
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <div class="input-wrapper-cyber">
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="telefono">Número de Teléfono *</label>
                    <div class="input-wrapper-cyber">
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3364123456" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="documento">DNI / Pasaporte *</label>
                    <div class="input-wrapper-cyber">
                        <input type="text" id="documento" name="documento" placeholder="Ej: 42345678" required>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="next-step-btn-link">Siguiente Paso →</button>
        </form>

        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <h3>ArroyoRent</h3>
                <p>Tu mejor opción de movilidad en San Nicolás.</p>
            </div>
            
            <div class="footer-contacto">
                <h3>Contacto</h3>
                <p>📍 Calle Falsa 123, San Nicolás</p>
                <p>📞 +54 336 456-7890</p>
                <p>✉️ contacto@arroyorent.com</p>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>&copy; 2026 ArroyoRent. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
