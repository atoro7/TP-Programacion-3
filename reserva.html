<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArroyoRent - Paso 2: Detalles del Alquiler</title>
    <link rel="stylesheet" href="./variables.css">
    <link rel="stylesheet" href="./styles2.css">
</head>
<body>
    <header style="justify-content: center;">
        <div class="logo">
            <img src="img/logo.png" alt="ArroyoRent Alquiler de Vehículos">
        </div>
    </header>

    <main class="reserva-main">
        <div class="wrapper">
            
            <div class="step-indicator">
                <span class="pending-step">Paso 1: Personal</span> → <span class="active-step">Paso 2: Alquiler</span>
            </div>

            <form action="#" method="POST" class="form-card-static">
                <div class="title">Detalles del Alquiler</div>
                <p class="step-desc">Configuración del vehículo y opciones extras</p>
                
                <div class="scroll-container-static">
                    
                    <div class="form-row-grid">
                        <div class="form-group">
                            <label for="tipo-vehiculo">Tipo de Vehículo *</label>
                            <select class="flip-card__input custom-select" id="tipo-vehiculo" name="tipo_vehiculo" required>
                                <option value="" disabled selected>Categoría...</option>
                                <option value="compacto">Auto Compacto</option>
                                <option value="suv">SUV Familiar</option>
                                <option value="camioneta">Camioneta</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="modelo">Modelo *</label>
                            <select class="flip-card__input custom-select" id="modelo" name="modelo" required>
                                <option value="" disabled selected>Modelo...</option>
                                <option value="kwid">Renault Kwid</option>
                                <option value="t-cross">Volkswagen T-Cross</option>
                                <option value="hilux">Toyota Hilux</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row-grid">
                        <div class="form-group">
                            <label for="fecha-retiro">Fecha Retiro *</label>
                            <input class="flip-card__input" type="date" id="fecha-retiro" name="fecha_retiro" required>
                        </div>
                        <div class="form-group">
                            <label for="hora-retiro">Hora Retiro *</label>
                            <input class="flip-card__input" type="time" id="hora-retiro" name="hora_retiro" required>
                        </div>
                    </div>

                    <div class="form-row-grid">
                        <div class="form-group">
                            <label for="fecha-devolucion">Fecha Devolución *</label>
                            <input class="flip-card__input" type="date" id="fecha-devolucion" name="fecha_devolucion" required>
                        </div>
                        <div class="form-group">
                            <label for="sucursal">Sucursal *</label>
                            <select class="flip-card__input custom-select" id="sucursal" name="sucursal" required>
                                <option value="" disabled selected>Oficina...</option>
                                <option value="centro">San Nicolás Centro</option>
                                <option value="terminal">Terminal Ómnibus</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label class="section-sub-label">Método de Pago *</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="metodo_pago" value="tarjeta" checked required> Tarjeta Crédito/Débito
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="metodo_pago" value="transferencia"> Transferencia / MP
                            </label>
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label class="section-sub-label">Opciones Adicionales</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="adicionales[]" value="gps"> GPS Satelital
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="adicionales[]" value="silla_ninos"> Silla Bebé
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="adicionales[]" value="seguro"> Seguro Premium
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="observaciones">Observaciones adicionales</label>
                        <textarea class="flip-card__input custom-textarea" id="observaciones" name="observaciones" rows="3" placeholder="Preferencias o notas..."></textarea>
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="reset" class="flip-card__btn reset-btn">Limpiar</button>
                    <button type="submit" class="flip-card__btn submit-btn">Reservar</button>
                </div>
            </form>

            <a href="./register.html" class="back-link">← Volver a Datos Personales</a>

        </div>
    </main>

    <footer>
        <div class="footer-container" style="justify-content: center; text-align: center;">
            <div>
                <h3>ArroyoRent</h3>
                <p>Tu libertad de moverte en San Nicolás y la región.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 ArroyoRent. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
